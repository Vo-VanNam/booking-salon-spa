# ============================================================
# Nginx reverse proxy — HTTPS (production)
# ============================================================
# THAY DOMAIN: thay toan bo "salon-glow.example.com" bang domain that.
# Duong dan cert theo dung layout Let's Encrypt:
#   /etc/letsencrypt/live/<domain>/fullchain.pem
#   /etc/letsencrypt/live/<domain>/privkey.pem
# Local test: sinh self-signed vao deploy/certs/live/salon-glow.example.com/
# (xem deploy/README-DEPLOY.md — cert duoc mount tu ./deploy/certs).
# File nay duoc mount vao /etc/nginx/conf.d/default.conf (http context),
# nen log_format dat o day la hop le.
# ============================================================

log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_time';

upstream backend_app {
    server backend:3001;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 443 ssl;
    http2 on;
    server_name salon-glow.example.com;

    ssl_certificate     /etc/letsencrypt/live/salon-glow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salon-glow.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload nho (booking note, payment khong nhan file)
    client_max_body_size 1m;

    access_log /var/log/nginx/access.log main_timed;
    error_log  /var/log/nginx/error.log warn;

    # API backend — giu nguyen prefix /api (proxy_pass khong co URI)
    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
