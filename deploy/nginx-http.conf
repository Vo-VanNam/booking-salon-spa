# ============================================================
# Nginx port 80 — phuc vu ACME challenge cho certbot + redirect HTTPS
# ============================================================
# /.well-known/acme-challenge/ phuc vu tu /var/www/certbot (webroot).
# May chu certbot (container hoac host) ghi challenge vao day de xac minh.
# File nay duoc mount vao /etc/nginx/conf.d/http.conf.
# ============================================================

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
