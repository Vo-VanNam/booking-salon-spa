# Nginx reverse proxy cho production stack (DOCUMENT.md §7).
# - /            → frontend (Next.js, cổng 8101)
# - /api/…       → backend  (NestJS, cổng 8100; tiền tố /api được bỏ khi chuyển tiếp)
# - /health      → backend health check (dùng cho giám sát nội bộ)
#
# HTTPS: chạy certbot để lấy chứng chỉ, sau đó mở khối "server 443" bên dưới.
#   docker run --rm -v booking_nginx_certs:/etc/letsencrypt -v $(pwd)/nginx/certbot-www:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot -d <domain> --email <email> --agree-tos -n

upstream booking_frontend {
    server frontend:8101;
    keepalive 16;
}

upstream booking_backend {
    server backend:8100;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # ACME challenge cho certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://booking_backend/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://booking_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://booking_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

